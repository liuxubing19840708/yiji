# 扫菲 nginx 站点配置 —— 复制到 /etc/nginx/sites-available/saofei 并软链 sites-enabled
# 前置：certbot --nginx -d api.yourdomain.com 自动补 443/证书段落；先按 80 版本跑通再签。
server {
    listen 80;
    server_name api.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;

    # certbot 会自动维护以下两行
    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;

    # 小程序视频上传上限（客户端 50MB）
    client_max_body_size 50m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    access_log /var/log/nginx/saofei-access.log;
    error_log  /var/log/nginx/saofei-error.log;

    location /static/ {
        alias /opt/saofei/backend/static/;
        expires 7d;
    }

    location /media/ {
        alias /opt/saofei/backend/media/;
        expires 7d;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8001;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
